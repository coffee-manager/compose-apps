<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" width="800" height="456" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif">
  <rect width="800" height="456" fill="#ffffff"/>

  <!-- 왼쪽: 플랫폼별 주문 알림 -->
  <text x="40" y="52" font-size="17" font-weight="700" fill="#7a8291">새 주문이 들어오면</text>

  <g transform="translate(40 72)">
    <rect width="360" height="76" rx="12" fill="#f7f8f5" stroke="#d9dcd3"/>
    <circle cx="40" cy="38" r="20" fill="#17202e"/>
    <text x="40" y="44" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">앱</text>
    <text x="74" y="33" font-size="18" font-weight="700" fill="#17202e">앱오더</text>
    <text x="74" y="56" font-size="14" fill="#7a8291">포장 주문 1건</text>
    <rect x="262" y="22" width="80" height="32" rx="16" fill="#e3f4ea"/>
    <text x="302" y="43" font-size="15" font-weight="700" fill="#1e8e4f" text-anchor="middle">수락 ✓</text>
  </g>

  <g transform="translate(40 164)">
    <rect width="360" height="76" rx="12" fill="#f7f8f5" stroke="#d9dcd3"/>
    <circle cx="40" cy="38" r="20" fill="#2ac1bc"/>
    <text x="40" y="44" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">배</text>
    <text x="74" y="33" font-size="18" font-weight="700" fill="#17202e">배민</text>
    <text x="74" y="56" font-size="14" fill="#7a8291">배달·포장 주문 1건</text>
    <rect x="262" y="22" width="80" height="32" rx="16" fill="#e3f4ea"/>
    <text x="302" y="43" font-size="15" font-weight="700" fill="#1e8e4f" text-anchor="middle">수락 ✓</text>
  </g>

  <g transform="translate(40 256)">
    <rect width="360" height="76" rx="12" fill="#f7f8f5" stroke="#d9dcd3"/>
    <circle cx="40" cy="38" r="20" fill="#3b6fe0"/>
    <text x="40" y="44" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">쿠</text>
    <text x="74" y="33" font-size="18" font-weight="700" fill="#17202e">쿠팡이츠</text>
    <text x="74" y="56" font-size="14" fill="#7a8291">배달 주문 1건</text>
    <rect x="262" y="22" width="80" height="32" rx="16" fill="#e3f4ea"/>
    <text x="302" y="43" font-size="15" font-weight="700" fill="#1e8e4f" text-anchor="middle">수락 ✓</text>
  </g>

  <g transform="translate(40 348)">
    <rect width="360" height="76" rx="12" fill="#f7f8f5" stroke="#d9dcd3"/>
    <circle cx="40" cy="38" r="20" fill="#e5383b"/>
    <text x="40" y="44" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">요</text>
    <text x="74" y="33" font-size="18" font-weight="700" fill="#17202e">요기요</text>
    <text x="74" y="56" font-size="14" fill="#7a8291">배달 주문 1건</text>
    <rect x="262" y="22" width="80" height="32" rx="16" fill="#e3f4ea"/>
    <text x="302" y="43" font-size="15" font-weight="700" fill="#1e8e4f" text-anchor="middle">수락 ✓</text>
  </g>

  <!-- 가운데 화살표 -->
  <path d="M418 248 H476" stroke="#c4c8bd" stroke-width="4" stroke-linecap="round"/>
  <path d="M466 236 L480 248 L466 260" fill="none" stroke="#c4c8bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 오른쪽: 포스기 -->
  <text x="500" y="52" font-size="17" font-weight="700" fill="#7a8291">포스기가 알아서 수락</text>
  <rect x="500" y="92" width="260" height="210" rx="14" fill="#17202e"/>
  <rect x="512" y="104" width="236" height="186" rx="6" fill="#f2f3ef"/>
  <!-- 프로그램 창 -->
  <rect x="528" y="120" width="204" height="62" rx="6" fill="#ffffff" stroke="#1e8e4f" stroke-width="4"/>
  <circle cx="552" cy="151" r="7" fill="#1e8e4f"/>
  <text x="568" y="146" font-size="14" font-weight="700" fill="#17202e">자동수락</text>
  <text x="568" y="166" font-size="14" font-weight="700" fill="#1e8e4f">동작 중</text>
  <!-- 켜진 항목 -->
  <g font-size="13" fill="#4a5363">
    <text x="530" y="212">앱오더</text>
    <text x="530" y="236">배민</text>
    <text x="530" y="260">쿠팡이츠</text>
    <text x="530" y="284">요기요</text>
  </g>
  <g fill="#1e8e4f">
    <rect x="696" y="200" width="34" height="16" rx="8"/><circle cx="722" cy="208" r="5.5" fill="#fff"/>
    <rect x="696" y="224" width="34" height="16" rx="8"/><circle cx="722" cy="232" r="5.5" fill="#fff"/>
    <rect x="696" y="248" width="34" height="16" rx="8"/><circle cx="722" cy="256" r="5.5" fill="#fff"/>
    <rect x="696" y="272" width="34" height="16" rx="8"/><circle cx="722" cy="280" r="5.5" fill="#fff"/>
  </g>
  <!-- 받침 -->
  <rect x="612" y="302" width="36" height="34" fill="#4a5363"/>
  <rect x="568" y="336" width="124" height="12" rx="6" fill="#4a5363"/>

  <text x="630" y="394" font-size="15" fill="#7a8291" text-anchor="middle">손님 응대 중에도</text>
  <text x="630" y="416" font-size="15" fill="#7a8291" text-anchor="middle">주문을 놓치지 않아요</text>
</svg>
